<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1210" viewBox="0 0 1800 1210" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#374151"/>
    </marker>
    <marker id="seta-vermelha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b91c1c"/>
    </marker>
    <style>
      .titulo { font-size: 30px; font-weight: bold; fill: #111827; }
      .subtitulo { font-size: 17px; fill: #4b5563; }
      .h { font-size: 18px; font-weight: bold; fill: #111827; }
      .t { font-size: 15px; fill: #1f2937; }
      .p { font-size: 13px; fill: #374151; }
      .mono { font-family: DejaVu Sans Mono, monospace; font-size: 13px; fill: #1f2937; }
      .seta { stroke: #374151; stroke-width: 2; fill: none; marker-end: url(#seta); }
      .seta-vermelha { stroke: #b91c1c; stroke-width: 2; fill: none; marker-end: url(#seta-vermelha); }
      .tracejado { stroke: #b91c1c; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
    </style>
  </defs>

  <rect width="1800" height="1210" fill="#ffffff"/>

  <!-- Título -->
  <text x="40" y="48" class="titulo">Orquestrador: execuções isoladas, até 20 em paralelo</text>
  <text x="40" y="76" class="subtitulo">Paralelismo só entre execuções; dentro de cada execução, um consumer processa uma mensagem por vez (Qos 1)</text>

  <!-- Linha 1: do plano à fila de execuções pendentes -->
  <rect x="40" y="100" width="330" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="58" y="128" class="h">1. Plano (plan.json)</text>
  <text x="58" y="153" class="t">108 combinações (A × B × C × E)</text>
  <text x="58" y="175" class="t">10 repetições cada</text>
  <text x="58" y="197" class="p">shared_env + ajustes por rodada</text>

  <path d="M370,155 L418,155" class="seta"/>

  <rect x="420" y="100" width="300" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="438" y="128" class="h">2. Expand</text>
  <text x="438" y="153" class="t">1.080 execuções</text>
  <text x="438" y="178" class="mono">run_id = &lt;rodada&gt;_repNN</text>

  <path d="M720,155 L768,155" class="seta"/>

  <rect x="770" y="100" width="330" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="788" y="128" class="h">3. Shuffle(seed)</text>
  <text x="788" y="153" class="t">ordem aleatória (Seção 8)</text>
  <text x="788" y="175" class="t">mesma seed → mesma ordem</text>
  <text x="788" y="197" class="mono">execution_order.csv</text>

  <path d="M1100,155 L1148,155" class="seta"/>

  <rect x="1150" y="100" width="610" height="110" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <text x="1168" y="128" class="h">4. Execuções pendentes (em ordem embaralhada)</text>
  <rect x="1168" y="142" width="270" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1178" y="160" class="mono">aimd_b10_outage_e3_rep07</text>
  <rect x="1448" y="142" width="296" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1458" y="160" class="mono">fixed_b10_uniform_e3_rep04</text>
  <rect x="1168" y="174" width="270" height="26" rx="5" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1178" y="192" class="mono">exponential_b30_outage_e5_rep09</text>
  <text x="1460" y="192" class="t">… (1.080 no total)</text>

  <!-- seta da fila pendente para o orquestrador -->
  <path d="M1455,210 L1455,236 L700,236 L700,262" class="seta"/>
  <text x="790" y="230" class="p">cada vaga livre puxa a próxima execução da fila</text>

  <!-- Orquestrador -->
  <rect x="40" y="264" width="1320" height="636" rx="12" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="60" y="294" class="h">Orquestrador — pool de 20 vagas (-parallel 20)</text>
  <text x="60" y="316" class="p">Um semáforo limita a 20 execuções simultâneas. Cada vaga roda uma execução do início ao fim e, ao terminar, libera a vaga para a próxima.</text>

  <!-- Vaga 1 (detalhada) -->
  <rect x="60" y="332" width="1280" height="206" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="78" y="358" class="h">Vaga 1</text>
  <text x="170" y="358" class="mono">execução: hpa_b30_outage_e5_rep01</text>

  <rect x="80" y="378" width="220" height="100" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="96" y="402" class="h">producer</text>
  <text x="96" y="424" class="p">processo novo, via AMQP</text>
  <text x="96" y="446" class="p">tasks.json: 1.000 msgs</text>
  <text x="96" y="466" class="p">a 2,5 msgs/s (Poisson)</text>

  <path d="M300,428 L338,428" class="seta"/>

  <rect x="340" y="378" width="250" height="100" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="356" y="402" class="h">fila própria</text>
  <text x="356" y="425" class="mono">tasks_&lt;run_id&gt;</text>
  <text x="356" y="448" class="p">apagada antes e depois</text>
  <text x="356" y="466" class="p">da execução</text>

  <path d="M590,428 L628,428" class="seta"/>

  <rect x="630" y="378" width="260" height="100" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="646" y="402" class="h">consumer</text>
  <text x="646" y="424" class="p">processo novo, Qos(1)</text>
  <text x="646" y="446" class="p">estratégia e estado do</text>
  <text x="646" y="466" class="p">AIMD/HPA começam do zero</text>

  <path d="M890,428 L938,428" class="seta"/>

  <rect x="940" y="378" width="250" height="100" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="956" y="402" class="h">apisim</text>
  <text x="956" y="424" class="p">processo novo, porta própria</text>
  <text x="956" y="446" class="p">recebe HTTP POST do consumer</text>
  <text x="956" y="466" class="p">ciclo de falhas começa ao subir</text>

  <!-- saídas da vaga 1 -->
  <path d="M760,478 L760,494" class="seta"/>
  <rect x="640" y="496" width="240" height="30" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="652" y="516" class="mono">&lt;rodada&gt;/&lt;run_id&gt;.csv</text>
  <path d="M1065,478 L1065,494" class="seta"/>
  <rect x="945" y="496" width="240" height="30" rx="5" fill="#f9fafb" stroke="#9ca3af"/>
  <text x="957" y="516" class="p">trocas de janela (cronograma)</text>

  <text x="1210" y="388" class="h">isolado</text>
  <text x="1210" y="412" class="p">• processos novos</text>
  <text x="1210" y="432" class="p">• porta própria</text>
  <text x="1210" y="452" class="p">• fila própria</text>
  <text x="1210" y="472" class="p">• arquivos próprios</text>
  <text x="1210" y="492" class="p">• sem memória</text>
  <text x="1222" y="512" class="p">compartilhada</text>

  <!-- Vaga 2 (resumida) -->
  <rect x="60" y="546" width="1280" height="110" rx="10" fill="#ffffff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="78" y="572" class="h">Vaga 2</text>
  <text x="170" y="572" class="mono">execução: none_b50_uniform_e10_rep02</text>
  <rect x="80" y="588" width="220" height="50" rx="8" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="96" y="618" class="h">producer</text>
  <path d="M300,613 L338,613" class="seta"/>
  <rect x="340" y="588" width="250" height="50" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="356" y="618" class="mono">tasks_&lt;run_id&gt;</text>
  <path d="M590,613 L628,613" class="seta"/>
  <rect x="630" y="588" width="260" height="50" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="646" y="618" class="h">consumer</text>
  <path d="M890,613 L938,613" class="seta"/>
  <rect x="940" y="588" width="250" height="50" rx="8" fill="#fff7ed" stroke="#c2410c" stroke-width="1.5"/>
  <text x="956" y="618" class="h">apisim</text>
  <text x="1210" y="618" class="p">mesma estrutura,</text>
  <text x="1210" y="636" class="p">outra porta e fila</text>

  <!-- Vagas 3 a 20 -->
  <text x="78" y="690" class="h">Vagas 3 a 20</text>
  <g>
    <rect x="220" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="240" y="692" class="p">vaga 3</text>
    <rect x="328" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="348" y="692" class="p">vaga 4</text>
    <rect x="436" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="456" y="692" class="p">vaga 5</text>
    <rect x="544" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="564" y="692" class="p">vaga 6</text>
    <text x="660" y="692" class="h">…</text>
    <rect x="700" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="716" y="692" class="p">vaga 19</text>
    <rect x="808" y="670" width="96" height="34" rx="6" fill="#ffffff" stroke="#6366f1"/><text x="824" y="692" class="p">vaga 20</text>
  </g>
  <text x="930" y="692" class="p">cada uma com seu producer, fila, consumer e apisim</text>

  <!-- RabbitMQ compartilhado -->
  <rect x="340" y="740" width="850" height="140" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
  <text x="360" y="768" class="h">RabbitMQ — 1 broker compartilhado</text>
  <text x="360" y="792" class="t">as filas das vagas (em vermelho) ficam neste broker; cada execução usa só a própria</text>
  <text x="360" y="816" class="p">carga total pequena: 20 execuções × 2,5 msgs/s ≈ 50 msgs/s</text>
  <text x="360" y="838" class="p">nos pilotos, a latência medida com 20 execuções simultâneas ficou igual à configurada</text>
  <text x="360" y="860" class="p">(60,5ms vs. 60ms; 12,4ms vs. 12ms): sem sinal de interferência</text>

  <!-- Saídas -->
  <path d="M1360,580 L1398,580" class="seta"/>
  <rect x="1400" y="264" width="360" height="636" rx="12" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <text x="1420" y="294" class="h">Saída (-metrics-dir)</text>
  <text x="1420" y="316" class="p">precisa estar vazio: o orquestrador recusa</text>
  <text x="1420" y="334" class="p">rodar sobre resultados anteriores</text>

  <rect x="1420" y="356" width="320" height="112" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1434" y="380" class="mono">&lt;rodada&gt;/&lt;run_id&gt;.csv</text>
  <text x="1434" y="404" class="t">por tentativa</text>
  <text x="1434" y="426" class="p">gravado pelo consumer: resultado,</text>
  <text x="1434" y="444" class="p">duração e espera de cada tentativa</text>
  <text x="1434" y="462" class="p">e resultado final da mensagem</text>

  <rect x="1420" y="480" width="320" height="130" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1434" y="504" class="mono">runs_summary.csv</text>
  <text x="1434" y="528" class="t">por execução</text>
  <text x="1434" y="550" class="p">status, início e fim, níveis efetivos</text>
  <text x="1434" y="568" class="p">dos fatores A–E, parâmetros e início</text>
  <text x="1434" y="586" class="p">do ciclo de falhas do apisim</text>

  <rect x="1420" y="622" width="320" height="112" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1434" y="646" class="mono">failure_windows.csv</text>
  <text x="1434" y="670" class="t">cronograma das janelas</text>
  <text x="1434" y="692" class="p">início e fim de cada janela, gravados</text>
  <text x="1434" y="710" class="p">pelo apisim no momento de cada troca</text>

  <rect x="1420" y="746" width="320" height="92" rx="8" fill="#ffffff" stroke="#9ca3af"/>
  <text x="1434" y="770" class="mono">execution_order.csv</text>
  <text x="1434" y="794" class="t">ordem das execuções</text>
  <text x="1434" y="816" class="p">posição, run_id e seed</text>

  <!-- Ciclo de vida de uma execução -->
  <text x="40" y="948" class="h">Ciclo de vida de uma execução, dentro de uma vaga (sequencial)</text>

  <g>
    <rect x="40" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="54" y="992" class="h">1</text>
    <text x="54" y="1016" class="p">reserva uma</text>
    <text x="54" y="1034" class="p">porta livre</text>

    <path d="M238,1018 L254,1018" class="seta"/>
    <rect x="256" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="270" y="992" class="h">2</text>
    <text x="270" y="1016" class="p">sobe o apisim e espera</text>
    <text x="270" y="1034" class="p">/__health responder</text>
    <text x="270" y="1052" class="p">com o run_id</text>

    <path d="M454,1018 L470,1018" class="seta"/>
    <rect x="472" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="486" y="992" class="h">3</text>
    <text x="486" y="1016" class="p">apaga a fila</text>
    <text x="486" y="1034" class="p">tasks_&lt;run_id&gt;</text>
    <text x="486" y="1052" class="p">(sem restos)</text>

    <path d="M670,1018 L686,1018" class="seta"/>
    <rect x="688" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="702" y="992" class="h">4</text>
    <text x="702" y="1016" class="p">sobe o consumer</text>
    <text x="702" y="1034" class="p">(estado da estratégia</text>
    <text x="702" y="1052" class="p">começa do zero)</text>

    <path d="M886,1018 L902,1018" class="seta"/>
    <rect x="904" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="918" y="992" class="h">5</text>
    <text x="918" y="1016" class="p">sobe o producer:</text>
    <text x="918" y="1034" class="p">publica 1.000 msgs</text>
    <text x="918" y="1052" class="p">a 2,5 msgs/s</text>

    <path d="M1102,1018 L1118,1018" class="seta"/>
    <rect x="1120" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="1134" y="992" class="h">6</text>
    <text x="1134" y="1016" class="p">espera drenar: 1.000</text>
    <text x="1134" y="1034" class="p">resultados finais</text>
    <text x="1134" y="1052" class="p">no CSV da execução</text>

    <path d="M1318,1018 L1334,1018" class="seta"/>
    <rect x="1336" y="966" width="198" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="1350" y="992" class="h">7</text>
    <text x="1350" y="1016" class="p">para o consumer,</text>
    <text x="1350" y="1034" class="p">apaga a fila,</text>
    <text x="1350" y="1052" class="p">para o apisim</text>

    <path d="M1534,1018 L1550,1018" class="seta"/>
    <rect x="1552" y="966" width="208" height="104" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
    <text x="1566" y="992" class="h">8</text>
    <text x="1566" y="1016" class="p">grava o registro da</text>
    <text x="1566" y="1034" class="p">execução e libera a</text>
    <text x="1566" y="1052" class="p">vaga → próxima da fila</text>
  </g>

  <!-- Rodapé -->
  <rect x="40" y="1100" width="1720" height="84" rx="10" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="60" y="1130" class="t"><tspan font-weight="bold">Dentro de uma execução:</tspan> 1 consumer, Qos(1), uma mensagem por vez — preserva o sistema medido e a ordem das observações do AIMD/HPA.</text>
  <text x="60" y="1160" class="t"><tspan font-weight="bold">Entre execuções:</tspan> até 20 ao mesmo tempo, em processos separados; a ordem aleatória espalha qualquer interferência residual entre todas as combinações.</text>
</svg>
